
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - PORT=8080
      - DB_PATH=/data/calorize.db
      - DEV_AUTH=true
    volumes:
      - output-data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  output-data:
