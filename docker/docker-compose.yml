networks:
  app-network:
    driver: bridge

services:
  calorize-api:
    build:
      context: ../
      dockerfile: docker/Dockerfile.api
    environment:
      - PORT=${API_PORT:-8080}
      - DB_PATH=/data/calorize.db
      - DEV_AUTH=false
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-calorize.test}
      - WEBAUTHN_RP_ORIGINS=${WEBAUTHN_RP_ORIGINS:-https://calorize.test}
      - WEBAUTHN_RP_DISPLAY_NAME=${WEBAUTHN_RP_DISPLAY_NAME:-Calorize}
      - IMPORT_DIR=/data/import
      - IMPORTED_DIR=/data/imported
    networks:
      - app-network
    expose:
      - "8080"                      # internal only — not host-mapped
    volumes:
      - ./data:/data           
    restart: unless-stopped

  calorize-web:
    build:
      context: ../
      dockerfile: docker/Dockerfile.web
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    depends_on:
      - calorize-api
    networks:
      - app-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: unless-stopped

volumes:
  output-data:
