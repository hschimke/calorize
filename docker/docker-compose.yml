networks:
  app-network:
    driver: bridge

services:
  calorize-api:
    build:
      context: ../
      dockerfile: Dockerfile.api
    environment:
      - PORT=${API_PORT:-8080}
      - DB_PATH=/data/calorize.db
      - DEV_AUTH=false
    networks:
      - app-network
    expose:
      - "8080"                      # internal only — not host-mapped
    volumes:
      - ./data:/data           
    restart: unless-stopped

  calorize-web:
    build:
      context: ../
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - app-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: unless-stopped

volumes:
  output-data:
