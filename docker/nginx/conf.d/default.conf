limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Logging config handled by main nginx.conf
    
    # ----------------------------------------------------
    # Compression Settings (Gzip, Deflate, Brotli, Zstd)
    # ----------------------------------------------------
    
    # Gzip / Deflate
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

    # Brotli
    brotli on;
    brotli_comp_level 6;
    brotli_static on; # Serve pre-compressed .br files if available
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

    # Zstd
    zstd on;
    zstd_comp_level 6;
    zstd_static on; # Serve pre-compressed .zst files if available
    zstd_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

    # ----------------------------------------------------

    # Nginx self-health endpoint
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # API proxy — rate limited, with timeouts matching image upload use case
    location /api/v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;

        # The rust API already streams its responses, we don't necessarily want our 
        # internal Nginx to compress them further if they are images, but JSON is fine 
        # (handled by the content-type filters above).
        proxy_pass http://calorize-api:8080;
        proxy_http_version 1.1;
        
        # We trust the X-Forwarded headers passed by the bare-metal host nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";

        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;   # image uploads can be large
        proxy_read_timeout    120s;   # image processing can be slow
        client_max_body_size  250m;   # matches Rust's RequestBodyLimitLayer
    }

    # Static files — multi-page app (not SPA, so no /index.html fallback)
    root /srv/static;
    index index.html;

    # HTML: force revalidation (no fingerprinted filenames)
    # Allows falling back to $uri/index.html to support subdirectories like /color-match/
    location ~* \.html$ {
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    # JS/CSS/PNG: 15-minute cache (short enough to limit deployment skew without fingerprinting)
    location ~* \.(js|css|png)$ {
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "public, max-age=900" always;
        try_files $uri =404;
    }

    # WASM: revalidate on every load (files are not fingerprinted)
    location ~* \.wasm$ {
        include /etc/nginx/conf.d/security_headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Default: serve directory index or exact file, 404 otherwise
    # Allows /color-match to resolve to /color-match/index.html
    location / {
        include /etc/nginx/conf.d/security_headers.conf;
        try_files $uri $uri/ $uri/index.html =404;
    }
}
