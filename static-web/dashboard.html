<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Calorize</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/bootstrap.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</head>

<body>
    <div id="app" class="container">
        <h1>Dashboard</h1>

        <div class="stats-container">
            <div class="stat-card">
                <h3>Calories</h3>
                <span id="dashboard-calories">0</span>
            </div>
            <div class="stat-card">
                <h3>Protein</h3>
                <span id="dashboard-protein">0</span>g
            </div>
            <div class="stat-card">
                <h3>Carbs</h3>
                <span id="dashboard-carbs">0</span>g
            </div>
            <div class="stat-card">
                <h3>Fat</h3>
                <span id="dashboard-fat">0</span>g
            </div>
        </div>

        <div class="logs-section">
            <h2>Today's Logs</h2>
            <ul id="dashboard-logs-list">
                <!-- Logs will be populated here -->
            </ul>
        </div>
    </div>
</body>

</html>
