<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <meta name="description" content="Login to Calorize, a simple calorie tracking application.">
    <title>Calorize - Login</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/bootstrap.js"></script>
    <script type="module" src="js/login.js"></script>
</head>

<body>
    <div class="login-page">
        <h1>Calorize</h1>

        <div class="panel">
            <h2>Login</h2>
            <form action="/login" method="post" id="login-form">
                <div class="form-group">
                    <label for="login-username">Username / Email</label>
                    <input type="text" id="login-username" name="username" placeholder="Username or email">
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>

        <div class="panel">
            <h2>Register</h2>
            <form action="/register" method="post" id="register-form">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" name="username" placeholder="Username">
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" name="email" placeholder="Email">
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </div>
    </div>
</body>

</html>
