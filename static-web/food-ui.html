<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorize</title>
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/bootstrap.js"></script>
    <script type="module" src="js/food-ui.js"></script>
</head>

<body>
    <div id="app" class="container">
        <h1>Foods</h1>

        <div class="panel">
            <h2 id="form-heading">Add New Food</h2>
            <form id="create-food-form">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" required placeholder="e.g. Banana">
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <div class="toggle-container">
                        <input type="radio" id="type-food" name="type" value="food" checked onchange="toggleFoodType()">
                        <label for="type-food">Basic Food</label>
                        <input type="radio" id="type-recipe" name="type" value="recipe" onchange="toggleFoodType()">
                        <label for="type-recipe">Recipe</label>
                    </div>
                </div>

                <div id="macros-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Calories</label>
                            <input type="number" name="calories" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>Protein (g)</label>
                            <input type="number" name="protein" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>Carbs (g)</label>
                            <input type="number" name="carbs" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>Fat (g)</label>
                            <input type="number" name="fat" step="0.1">
                        </div>
                    </div>
                    <!-- Dynamic Nutrients Section -->
                    <div class="form-group">
                        <label>Micro-Nutrients</label>
                        <div id="nutrients-container">
                            <!-- Dynamic rows will be added here -->
                        </div>
                        <button type="button" id="add-nutrient-btn" class="btn btn-secondary">+ Add Nutrient</button>
                    </div>
                </div>

                <div id="ingredients-section" style="display: none;">
                    <div class="form-group">
                        <label>Makes (servings)</label>
                        <input type="number" id="recipe-servings" value="1" min="1" step="1">
                    </div>
                    <div class="form-group">
                        <label>Ingredients</label>
                        <div class="ingredient-add-row">
                            <select id="ingredient-search">
                                <option value="">Select a food...</option>
                            </select>
                            <input type="number" id="ingredient-amount" placeholder="Amount" step="0.1">
                            <button type="button" onclick="addIngredient()" class="btn btn-secondary">Add</button>
                        </div>
                        <div id="ingredients-list">
                            <!-- Added ingredients will appear here -->
                        </div>
                        <div id="recipe-totals" style="display: none;">
                            <!-- Per-serving totals shown here -->
                        </div>
                    </div>
                </div>

                <button type="submit" id="form-submit-btn" class="btn btn-primary">Add Food</button>
                <button type="button" id="cancel-edit-btn" onclick="cancelEdit()" class="btn btn-secondary"
                    style="display: none;">Cancel</button>
            </form>
        </div>

        <div class="foods-list-section">
            <h2>Your Foods</h2>
            <ul id="foods-list" class="item-list">
                <!-- Foods will be populated here -->
            </ul>
        </div>
    </div>
</body>

</html>
