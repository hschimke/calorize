<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Calorize - Food Log</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/bootstrap.js"></script>
    <script type="module" src="js/foodlog.js"></script>
</head>

<body>
    <div id="app" class="container">
        <h1>Food Log</h1>

        <div class="controls-bar">
            <label for="log-date">Date:</label>
            <input type="date" id="log-date">
        </div>

        <div class="panel">
            <h2>Add Log</h2>
            <form id="add-log-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Entry Type</label>
                        <div class="toggle-container">
                            <input type="radio" id="mode-food" name="entry_mode" value="food" checked>
                            <label for="mode-food">Food</label>

                            <input type="radio" id="mode-quick" name="entry_mode" value="quick">
                            <label for="mode-quick">Quick Add</label>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" id="group-food" style="flex: 2;">
                        <label>Food</label>
                        <div id="food-search-container"></div>
                    </div>
                    <div class="form-group" id="group-portion" style="flex: 1; display: none;">
                        <label>Portion</label>
                        <select id="portion-select" class="form-control"></select>
                    </div>
                    <div class="form-group" id="group-calories" style="flex: 2; display: none;">
                        <label>Calories (kcal)</label>
                        <input type="number" name="calories" id="calories-input" min="0" step="1">
                        <label for="note-input">Note <span class="label-optional">(optional)</span></label>
                        <input type="text" id="note-input" name="note" maxlength="100" placeholder="e.g. handful of nuts">
                    </div>
                    <div class="form-group">
                        <label>Amount <span id="amount-unit-label" style="color: var(--color-text-muted); font-weight: normal;"></span></label>
                        <input type="number" name="amount" value="1" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>Meal</label>
                        <select name="meal_tag">
                            <option value="breakfast">Breakfast</option>
                            <option value="lunch">Lunch</option>
                            <option value="dinner">Dinner</option>
                            <option value="snack">Snack</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Log Food</button>
            </form>
        </div>

        <div class="stats-container">
            <div class="stat-card" id="foodlog-cal-card">
                <h3>Calories</h3>
                <span id="foodlog-calories">0</span>
            </div>
        </div>

        <div class="logs-list-section">
            <div class="section-header">
                <h2>Logs</h2>
                <button type="button" id="copy-day-btn" class="btn btn-secondary btn-sm">Copy from...</button>
            </div>
            <ul id="logs-list" class="item-list">
                <!-- Logs will be populated here -->
            </ul>
        </div>

        <dialog id="copy-day-dialog">
            <h2>Copy from another day</h2>
            <div class="form-group">
                <label for="copy-from-date">Copy from date</label>
                <input type="date" id="copy-from-date">
            </div>
            <div class="form-group">
                <label>Meals to copy</label>
                <div class="copy-meal-checks">
                    <label><input type="checkbox" name="copy_meal" value="breakfast" checked> Breakfast</label>
                    <label><input type="checkbox" name="copy_meal" value="lunch" checked> Lunch</label>
                    <label><input type="checkbox" name="copy_meal" value="dinner" checked> Dinner</label>
                    <label><input type="checkbox" name="copy_meal" value="snack" checked> Snack</label>
                </div>
            </div>
            <div id="copy-preview"></div>
            <div class="copy-dialog-actions">
                <button type="button" id="copy-confirm-btn" class="btn btn-primary" disabled>Copy 0 entries</button>
                <button type="button" id="copy-cancel-btn" class="btn btn-secondary">Cancel</button>
            </div>
        </dialog>
    </div>
</body>

</html>
