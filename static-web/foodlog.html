<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorize - Food Log</title>
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/bootstrap.js"></script>
    <script type="module" src="js/foodlog.js"></script>
</head>

<body>
    <div id="app" class="container">
        <h1>Food Log</h1>

        <div class="controls-bar">
            <label for="log-date">Date:</label>
            <input type="date" id="log-date">
        </div>

        <div class="panel">
            <h2>Add Log</h2>
            <form id="add-log-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Entry Type</label>
                        <div class="toggle-container">
                            <input type="radio" id="mode-food" name="entry_mode" value="food" checked>
                            <label for="mode-food">Food</label>

                            <input type="radio" id="mode-quick" name="entry_mode" value="quick">
                            <label for="mode-quick">Quick Add</label>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" id="group-food" style="flex: 2;">
                        <label>Food</label>
                        <div id="food-search-container"></div>
                    </div>
                    <div class="form-group" id="group-calories" style="flex: 2; display: none;">
                        <label>Calories (kcal)</label>
                        <input type="number" name="calories" id="calories-input" min="0" step="1">
                    </div>
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" name="amount" value="1" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>Meal</label>
                        <select name="meal_tag">
                            <option value="breakfast">Breakfast</option>
                            <option value="lunch">Lunch</option>
                            <option value="dinner">Dinner</option>
                            <option value="snack">Snack</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Log Food</button>
            </form>
        </div>

        <div class="logs-list-section">
            <h2>Logs</h2>
            <ul id="logs-list" class="item-list">
                <!-- Logs will be populated here -->
            </ul>
        </div>
    </div>
</body>

</html>
