<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorize - Account</title>
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/bootstrap.js"></script>
    <script type="module" src="js/account.js"></script>
</head>

<body>
    <div id="app" class="container">
        <div class="controls-bar">
            <h1>Account</h1>
            <button id="btn-add-passkey" class="btn btn-primary">Add New Passkey</button>
        </div>

        <div class="panel">
            <h2>Passkeys</h2>
            <ul id="passkey-list" class="item-list">
                <li id="passkey-loading">Loading&hellip;</li>
            </ul>
        </div>

        <div class="panel">
            <h2>Goals</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="calorie-goal-input">Daily Calorie Goal</label>
                    <div class="goal-input-row">
                        <input type="number" id="calorie-goal-input" min="0" step="1" placeholder="e.g. 2000">
                        <span>kcal</span>
                        <button id="btn-save-goal" class="btn btn-primary">Save Goal</button>
                    </div>
                    <p id="goal-derived" class="goal-derived-label"></p>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>Preferences</h2>

            <div class="form-group">
                <h3>Food Data Sources</h3>
                <p class="form-hint">Choose which public food databases appear in search results.</p>
                <div id="source-toggles">Loading&hellip;</div>
            </div>

            <div class="form-group">
                <h3>Visibility</h3>
                <label class="checkbox-label">
                    <input type="checkbox" id="hide-public-user-foods-toggle">
                    Hide other users&rsquo; public foods
                </label>
            </div>

            <div id="clown-mode-section" class="form-group" hidden>
                <h3>Fun Settings</h3>
                <label class="checkbox-label">
                    <input type="checkbox" id="clown-mode-toggle">
                    Clown Mode
                </label>
                <p class="form-hint">When you exceed your calorie goal, replace the progress bar with 🤡</p>
            </div>

            <button id="btn-save-preferences" class="btn btn-primary">Save Preferences</button>
        </div>
    </div>
</body>

</html>
