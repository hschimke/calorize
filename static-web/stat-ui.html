<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6c63ff">
    <title>Calorize - Stats</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/bootstrap.js"></script>
    <script type="module" src="js/stat-ui.js"></script>
</head>

<body>
    <div id="app" class="container">
        <h1>Stats</h1>

        <div class="period-selector">
            <button data-period="day" class="period-btn active">Today</button>
            <button data-period="week" class="period-btn">This Week</button>
            <button data-period="month" class="period-btn">This Month</button>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <h3>Calories</h3>
                <span id="stat-calories">0</span>
            </div>
            <div class="stat-card">
                <h3>Protein</h3>
                <span id="stat-protein">0</span>g
            </div>
            <div class="stat-card">
                <h3>Carbs</h3>
                <span id="stat-carbs">0</span>g
            </div>
            <div class="stat-card">
                <h3>Fat</h3>
                <span id="stat-fat">0</span>g
            </div>
        </div>

        <div class="panel chart-panel" id="panel-macro">
            <h2>Macro Distribution</h2>
            <canvas id="chart-macro"></canvas>
        </div>

        <div class="panel chart-panel" id="panel-meals">
            <h2>Calories by Meal</h2>
            <canvas id="chart-meals"></canvas>
        </div>

        <div class="panel chart-panel" id="panel-days" style="display:none">
            <h2>Calories by Day</h2>
            <canvas id="chart-days"></canvas>
        </div>

        <div class="panel chart-panel" id="panel-weeks" style="display:none">
            <h2>Calories by Week</h2>
            <canvas id="chart-weeks"></canvas>
        </div>
    </div>
</body>

</html>
